[package]
name = "gshare"
version = "0.2.0"
edition = "2024"
authors = ["Logan-010"]
description = "p2p file sharing"

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = [
  "core-graphics",
  "windows-sys",
  "wayland-data-control",
] }
beetswap = "0.5.0"
blake3 = { version = "1.8.2", features = ["serde", "mmap", "rayon"] }
blockstore = "0.8.0"
cid = "0.11.1"
clap = { version = "4.5.47", features = ["derive", "env"] }
color-eyre = "0.6.5"
indicatif = "0.18.0"
libp2p = { version = "0.56.0", features = [
  "tokio",
  "macros",
  "identify",
  "noise",
  "yamux",
  "relay",
  "dcutr",
  "rsa",
  "dns",
  "serde",
  "mdns",
  "tcp",
  "quic",
  "kad",
] }
libp2p-stream = "0.4.0-alpha"
multihash-codetable = { version = "0.1.4", features = ["sha2"] }
rand = "0.9.2"
tokio = { version = "1.47.1", features = [
  "fs",
  "rt-multi-thread",
  "macros",
  "signal",
  "sync",
] }
tokio-util = { version = "0.7.18", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
incremental = false
debug = false
