[package]
name = "gshare"
version = "0.1.0"
edition = "2024"
authors = ["Logan-010"]
description = "p2p file sharing"

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = [
  "core-graphics",
  "windows-sys",
  "wayland-data-control",
] }
base64 = "0.22.1"
blake3 = { version = "1.8.2", features = ["serde", "mmap", "rayon"] }
clap = { version = "4.5.47", features = ["derive", "env"] }
color-eyre = "0.6.5"
indicatif = "0.18.0"
libp2p = { version = "0.56.0", features = ["tokio", "macros", "identify", "noise", "yamux", "relay", "dcutr", "rsa", "dns", "serde", "mdns", "tcp", "quic"] }
libp2p-stream = "0.4.0-alpha"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.9.2"
serde = { version = "1.0.225", features = ["derive"] }
tokio = { version = "1.47.1", features = [
  "fs",
  "rt-multi-thread",
  "macros",
  "signal",
  "sync",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
incremental = false
debug = false
